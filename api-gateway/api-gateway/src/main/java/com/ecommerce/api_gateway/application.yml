server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:

        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**

        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventory/**

        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**