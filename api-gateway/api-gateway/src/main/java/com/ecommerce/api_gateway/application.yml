server:
  port: 8080

spring:
  cloud:
    gateway:
      # --- START OF CORS CONFIG ---
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://ecommerce-microservices-app.netlify.app" # Your Netlify URL
              - "http://localhost:3000" # For local React development
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # --- END OF CORS CONFIG ---

      routes:
        - id: product-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/products/**

        - id: inventory-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/inventory/**

        - id: order-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**